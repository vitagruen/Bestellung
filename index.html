<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vitagrün">
<meta name="theme-color" content="#2f7d32">
<title>Vitagrün Bestellung</title>

<style>
:root{--g:#2f7d32;--g2:#e8f3e8;--bg:#f6f7f5;--card:#fff;--tx:#1d2a1e;--mu:#6b776c;--bd:#dfe5df;--red:#c0392b;--or:#d98a00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--g);color:#fff;padding:14px 16px calc(14px);padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header b{font-size:19px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:17px;margin:0 0 8px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;font-size:16px;background:#fff;color:var(--tx)}
textarea{min-height:80px}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer}
.btn.w{width:100%;margin-top:14px}.btn.sec{background:var(--g2);color:var(--g)}.btn.red{background:#fbe9e7;color:var(--red)}.btn.sm{padding:7px 11px;font-size:14px;font-weight:500}
.link{background:none;border:0;color:var(--g);font-size:15px;text-decoration:underline;margin-top:14px;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:8px 14px;font-size:15px;color:var(--tx)}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.cat{font-weight:700;color:var(--g);margin:18px 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin-bottom:6px}
.row .n{flex:1;min-width:0}.row .n small{color:var(--mu);display:block}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:var(--g2);color:var(--g);font-size:20px;font-weight:700}
.qty input{width:62px;text-align:center;padding:7px 4px}
.row.has{border-color:var(--g);background:#f3faf3}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6}
.bar .t{flex:1;font-size:15px}
.msg{padding:11px 13px;border-radius:9px;margin:10px 0;font-size:15px}
.msg.ok{background:var(--g2);color:var(--g)}.msg.err{background:#fbe9e7;color:var(--red)}.msg.info{background:#fff6e0;color:#7a5200}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:500;font-size:13px}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:10px;background:var(--g2);color:var(--g)}
.pill.neu{background:#fff3d6;color:var(--or)}.pill.wait{background:#fbe9e7;color:var(--red)}
.muted{color:var(--mu);font-size:14px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ic{display:inline-flex;align-items:center;justify-content:center;background:#f1f7ec;border-radius:10px;padding:5px}.ic svg{width:100%;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:4px 12px 4px 4px;font-size:14px;color:var(--tx)}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}.chips .ic{padding:2px;background:#fff}
.cat{display:flex;align-items:center;gap:8px}
@media print{header,.tabs,.noprint,.bar{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#999}main{padding:0}}
</style>

function iconKey(p) {
  const n = ' ' + norm(p.name) + ' ';
  for (const [k, ws] of ICON_RULES) if (ws.some(w => n.includes(w))) return k;
  const c = norm(p.category);
  for (const [k, ws] of CAT_RULES) if (ws.some(w => c.includes(w))) return k;
  return 'kiste';
}
const icon = (p, sz = 52) => `<span class="ic" style="width:${sz}px;height:${sz}px;flex:0 0 ${sz}px"><svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[iconKey(p)]}</svg></span>`;


const $ = s => document.querySelector(s);
const app = () => $('#app');
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtQ = q => Number(q).toLocaleString('de-DE', {maximumFractionDigits: 2});
const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); };
const fmtDate = d => d ? new Date(d + 'T12:00').toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'2-digit', year:'numeric'}) : '–';
const fmtTime = t => new Date(t).toLocaleString('de-DE', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
const UNITS = ['kg','Stück','Kiste','Bund','Schale','Sack','Liter','Packung','Netz'];

let user = null, profile = null, products = [], cart = {}, search = '', catSel = '';
try { cart = JSON.parse(localStorage.getItem('vg_cart') || '{}'); } catch (e) { cart = {}; }
const saveCart = () => { try { localStorage.setItem('vg_cart', JSON.stringify(cart)); } catch (e) {} };

/* ---------- Start ---------- */
async function route() {
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user || null;
  if (!user) { $('#hdr').innerHTML = ''; return renderAuth('login'); }
  $('#hdr').innerHTML = '<button onclick="logout()">Abmelden</button>';
  const { data, error } = await sb.from('profiles').select('*').eq('id', user.id).single();
  if (error || !data) { app().innerHTML = `<div class="msg err">Profil nicht gefunden. Bitte erneut anmelden.</div>`; return; }
  profile = data;
  if (profile.is_admin) return renderAdmin('orders');
  if (!profile.approved) return renderPending();
  renderShop();
}
async function logout() { await sb.auth.signOut(); profile = null; route(); }

/* ---------- Anmelden / Registrieren ---------- */
function renderAuth(mode, note = '') {
  const reg = mode === 'register';
  app().innerHTML = `
  <div class="card">
    <h2>${reg ? 'Kundenkonto beantragen' : 'Anmelden'}</h2>
    ${note}
    <form id="f">
      ${reg ? `
      <label>Name des Restaurants *</label><input name="restaurant_name" required>
      <label>Ansprechpartner</label><input name="contact_name">
      <label>Telefon *</label><input name="phone" type="tel" required>
      <label>Lieferadresse *</label><input name="address" required>` : ''}
      <label>E-Mail *</label><input name="email" type="email" autocomplete="email" required>
      <label>Passwort * ${reg ? '(mind. 6 Zeichen)' : ''}</label><input name="password" type="password" minlength="6" autocomplete="${reg ? 'new-password' : 'current-password'}" required>
      <div id="err"></div>
      <button class="btn w">${reg ? 'Konto beantragen' : 'Anmelden'}</button>
    </form>
    <button class="link" onclick="renderAuth('${reg ? 'login' : 'register'}')">${reg ? 'Schon ein Konto? Anmelden' : 'Neuer Kunde? Konto beantragen'}</button>
  </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const btn = e.target.querySelector('button'); btn.disabled = true;
    let res;
    if (reg) {
      res = await sb.auth.signUp({ email: fd.email, password: fd.password, options: { data: {
        restaurant_name: fd.restaurant_name, contact_name: fd.contact_name, phone: fd.phone, address: fd.address } } });
      if (!res.error && !res.data.session) {
        return renderAuth('login', '<div class="msg ok">Konto erstellt. Bitte bestätigen Sie Ihre E-Mail und melden Sie sich dann an.</div>');
      }
    } else {
      res = await sb.auth.signInWithPassword({ email: fd.email, password: fd.password });
    }
    btn.disabled = false;
    if (res.error) { $('#err').innerHTML = `<div class="msg err">${h(translateErr(res.error.message))}</div>`; return; }
    route();
  };
}
function translateErr(m) {
  if (/Invalid login/i.test(m)) return 'E-Mail oder Passwort falsch.';
  if (/already registered/i.test(m)) return 'Diese E-Mail ist bereits registriert.';
  if (/Email not confirmed/i.test(m)) return 'Bitte bestätigen Sie zuerst Ihre E-Mail.';
  return m;
}
function renderPending() {
  app().innerHTML = `<div class="card"><h2>Willkommen, ${h(profile.restaurant_name)}!</h2>
  <div class="msg info">Ihr Konto wartet auf Freigabe durch Vitagrün. Sobald es freigeschaltet ist, können Sie hier bestellen.</div>
  <button class="btn sec" onclick="route()">Erneut prüfen</button></div>`;
}

/* ---------- Kunde: Bestellen ---------- */
async function loadProducts(all = false) {
  let q = sb.from('products').select('*').order('category', { nullsFirst: false }).order('sort').order('name');
  if (!all) q = q.eq('active', true);
  const { data, error } = await q;
  if (error) { alert(error.message); return []; }
  return data;
}
async function renderShop(tab = 'shop') {
  const tabs = `<div class="tabs"><button class="${tab === 'shop' ? 'on' : ''}" onclick="renderShop('shop')">Bestellen</button>
    <button class="${tab === 'mine' ? 'on' : ''}" onclick="renderShop('mine')">Meine Bestellungen</button></div>`;
  if (tab === 'mine') return renderMyOrders(tabs);
  app().innerHTML = tabs + '<p class="muted">Artikel werden geladen…</p>';
  products = await loadProducts();
  for (const id in cart) if (!products.find(p => p.id == id)) delete cart[id];
  app().innerHTML = tabs + `
    <p class="muted" style="margin-top:0">${h(profile.restaurant_name)} – wählen Sie Artikel und Mengen.</p>
    <input id="search" placeholder="🔍 Artikel suchen…" value="${h(search)}">
    <div class="chips" id="chips"></div>
    <div id="list"></div>
    <div class="bar"><div class="t" id="sum"></div><button class="btn" onclick="renderReview()">Weiter</button></div>`;
  $('#search').oninput = e => { search = e.target.value; drawList(); };
  drawChips(); drawList();
}
function drawChips() {
  const cats = [...new Set(products.map(p => p.category || 'Sonstiges'))];
  if (catSel && !cats.includes(catSel)) catSel = '';
  if (cats.length < 2) { $('#chips').innerHTML = ''; return; }
  window._cats = cats;
  const b = (i, label, ic, on) => `<button class="${on ? 'on' : ''}" onclick="catSel=${i < 0 ? "''" : '_cats[' + i + ']'};drawChips();drawList()">${ic}${h(label)}</button>`;
  $('#chips').innerHTML = b(-1, 'Alle', icon({ name: 'kiste' }, 28), !catSel) +
    cats.map((c, i) => b(i, c, icon(products.find(p => (p.category || 'Sonstiges') === c), 28), catSel === c)).join('');
}
function drawList() {
  const s = search.trim().toLowerCase();
  const items = products.filter(p => (!catSel || (p.category || 'Sonstiges') === catSel) && (!s || p.name.toLowerCase().includes(s) || (p.category || '').toLowerCase().includes(s)));
  if (!products.length) { $('#list').innerHTML = '<div class="msg info">Noch keine Artikel vorhanden.</div>'; return updateSum(); }
  let html = '', last = null;
  for (const p of items) {
    const c = p.category || 'Sonstiges';
    if (c !== last) { html += `<div class="cat">${h(c)}</div>`; last = c; }
    const q = cart[p.id] || '';
    html += `<div class="row ${q ? 'has' : ''}" id="r${p.id}">${icon(p)}<div class="n">${h(p.name)}<small>${h(p.unit)}</small></div>
      <div class="qty"><button onclick="chg(${p.id},-1)">−</button>
      <input type="number" inputmode="decimal" min="0" step="any" value="${q}" onchange="setQ(${p.id},this.value)">
      <button onclick="chg(${p.id},1)">+</button></div></div>`;
  }
  $('#list').innerHTML = html || '<p class="muted">Kein Artikel gefunden.</p>';
  updateSum();
}
function setQ(id, v) {
  const n = parseFloat(String(v).replace(',', '.'));
  if (!n || n <= 0) delete cart[id]; else cart[id] = Math.round(n * 100) / 100;
  saveCart();
  const r = $('#r' + id);
  if (r) { r.classList.toggle('has', !!cart[id]); r.querySelector('input').value = cart[id] || ''; }
  updateSum();
}
function chg(id, d) { setQ(id, Math.max(0, (cart[id] || 0) + d)); }
function updateSum() {
  const n = Object.keys(cart).length;
  if ($('#sum')) $('#sum').innerHTML = n ? `<b>${n}</b> Artikel ausgewählt` : '<span class="muted">Noch nichts ausgewählt</span>';
}
function renderReview() {
  const ids = Object.keys(cart);
  if (!ids.length) return alert('Bitte zuerst Artikel auswählen.');
  const rows = ids.map(id => { const p = products.find(x => x.id == id);
    return `<tr><td><div class="flex">${icon(p, 34)}${h(p.name)}</div></td><td class="r">${fmtQ(cart[id])} ${h(p.unit)}</td></tr>`; }).join('');
  app().innerHTML = `<div class="card"><h2>Bestellung prüfen</h2>
    <table><tr><th>Artikel</th><th class="r">Menge</th></tr>${rows}</table>
    <label>Lieferdatum</label><input type="date" id="dd" value="${tomorrow()}">
    <label>Hinweis (optional)</label><textarea id="note" placeholder="z. B. bitte vor 9 Uhr liefern"></textarea>
    <div id="err"></div>
    <button class="btn w" id="send" onclick="sendOrder()">Bestellung abschicken</button>
    <button class="btn sec w" onclick="renderShop()">Zurück / ändern</button></div>`;
}
async function sendOrder() {
  const btn = $('#send'); btn.disabled = true; btn.textContent = 'Wird gesendet…';
  const items = Object.entries(cart).map(([id, q]) => ({ product_id: Number(id), qty: q }));
  const { data, error } = await sb.rpc('place_order', { p_delivery_date: $('#dd').value || null, p_note: $('#note').value || null, p_items: items });
  if (error) { btn.disabled = false; btn.textContent = 'Bestellung abschicken'; $('#err').innerHTML = `<div class="msg err">${h(error.message)}</div>`; return; }
  cart = {}; saveCart();
  app().innerHTML = `<div class="card" style="text-align:center"><h2>✅ Danke!</h2>
    <p>Ihre Bestellung <b>Nr. ${data}</b> wurde gesendet.</p>
    <button class="btn" onclick="renderShop('mine')">Meine Bestellungen</button>
    <button class="btn sec w" onclick="renderShop()">Neue Bestellung</button></div>`;
}
async function renderMyOrders(tabs) {
  app().innerHTML = tabs + '<p class="muted">Lädt…</p>';
  const { data, error } = await sb.from('orders').select('*, order_items(*)').order('created_at', { ascending: false }).limit(30);
  if (error) return app().innerHTML = tabs + `<div class="msg err">${h(error.message)}</div>`;
  app().innerHTML = tabs + (data.length ? data.map(o => `<div class="card">
    <div class="flex" style="justify-content:space-between"><h3>Nr. ${o.id} – Lieferung ${fmtDate(o.delivery_date)}</h3><span class="pill ${o.status === 'neu' ? 'neu' : ''}">${h(o.status)}</span></div>
    <div class="muted">Gesendet ${fmtTime(o.created_at)}</div>
    <table>${o.order_items.map(i => `<tr><td>${h(i.product_name)}</td><td class="r">${fmtQ(i.quantity)} ${h(i.unit)}</td></tr>`).join('')}</table>
    ${o.note ? `<p class="muted">Hinweis: ${h(o.note)}</p>` : ''}
    <button class="btn sec sm" style="margin-top:8px" onclick="reorder(${o.id})">Nochmal bestellen</button></div>`).join('')
    : '<div class="msg info">Noch keine Bestellungen.</div>');
  window._mine = data;
}
function reorder(id) {
  const o = window._mine.find(x => x.id === id);
  cart = {}; o.order_items.forEach(i => { if (i.product_id) cart[i.product_id] = Number(i.quantity); });
  saveCart(); renderShop();
}

/* ---------- Admin ---------- */
let adminDate = tomorrow();
function adminTabs(t) {
  const b = (k, l) => `<button class="${t === k ? 'on' : ''}" onclick="renderAdmin('${k}')">${l}</button>`;
  return `<div class="tabs noprint">${b('orders', 'Bestellungen')}${b('pack', 'Packliste')}${b('customers', 'Kunden')}${b('products', 'Artikel')}</div>`;
}
const dateBar = fn => `<div class="flex noprint" style="margin-bottom:12px">
  <input type="date" value="${adminDate}" style="flex:1" onchange="adminDate=this.value;${fn}">
  <button class="btn sec sm" onclick="${fn}">↻</button><button class="btn sec sm" onclick="window.print()">🖨 Drucken</button></div>`;

function renderAdmin(t) {
  if (t === 'orders') return adminOrders();
  if (t === 'pack') return adminPack();
  if (t === 'customers') return adminCustomers();
  if (t === 'products') return adminProducts();
}
async function fetchOrders() {
  const { data, error } = await sb.from('orders').select('*, profiles(restaurant_name, phone, address), order_items(*)')
    .eq('delivery_date', adminDate).neq('status', 'storniert').order('created_at');
  if (error) { alert(error.message); return []; }
  return data;
}
async function adminOrders() {
  app().innerHTML = adminTabs('orders') + dateBar('adminOrders()') + '<p class="muted">Lädt…</p>';
  const data = await fetchOrders();
  app().innerHTML = adminTabs('orders') + dateBar('adminOrders()') +
    `<h2>Lieferung ${fmtDate(adminDate)} – ${data.length} Bestellung(en)</h2>` +
    (data.map(o => `<div class="card">
      <div class="flex" style="justify-content:space-between"><h3>${h(o.profiles?.restaurant_name)}</h3>
      <select class="noprint" style="width:auto" onchange="setStatus(${o.id},this.value)">
        ${['neu', 'bearbeitet', 'geliefert', 'storniert'].map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="muted">Nr. ${o.id} · ${fmtTime(o.created_at)} · ☎ ${h(o.profiles?.phone)}<br>${h(o.profiles?.address)}</div>
      <table>${o.order_items.map(i => `<tr><td>${h(i.product_name)}</td><td class="r"><b>${fmtQ(i.quantity)}</b> ${h(i.unit)}</td></tr>`).join('')}</table>
      ${o.note ? `<div class="msg info">Hinweis: ${h(o.note)}</div>` : ''}</div>`).join('') || '<div class="msg info">Keine Bestellungen für dieses Datum.</div>');
}
async function setStatus(id, s) {
  const { error } = await sb.from('orders').update({ status: s }).eq('id', id);
  if (error) alert(error.message);
}
async function adminPack() {
  app().innerHTML = adminTabs('pack') + dateBar('adminPack()') + '<p class="muted">Lädt…</p>';
  const data = await fetchOrders();
  const sum = {};
  data.forEach(o => o.order_items.forEach(i => { const k = i.product_name + '|' + i.unit; sum[k] = (sum[k] || 0) + Number(i.quantity); }));
  const rows = Object.entries(sum).sort((a, b) => a[0].localeCompare(b[0], 'de'));
  app().innerHTML = adminTabs('pack') + dateBar('adminPack()') +
    `<div class="card"><h2>Packliste / Einkauf ${fmtDate(adminDate)}</h2><p class="muted">Gesamtmengen aus ${data.length} Bestellung(en)</p>
    ${rows.length ? `<table><tr><th>Artikel</th><th class="r">Gesamt</th></tr>${rows.map(([k, q]) => { const [n, u] = k.split('|');
      return `<tr><td>${h(n)}</td><td class="r"><b>${fmtQ(q)}</b> ${h(u)}</td></tr>`; }).join('')}</table>` : '<p class="muted">Keine Artikel.</p>'}</div>`;
}
async function adminCustomers() {
  app().innerHTML = adminTabs('customers') + '<p class="muted">Lädt…</p>';
  const { data, error } = await sb.from('profiles').select('*').eq('is_admin', false).order('approved').order('created_at', { ascending: false });
  if (error) return alert(error.message);
  const open = data.filter(c => !c.approved).length;
  app().innerHTML = adminTabs('customers') + `<h2>Kunden (${data.length})</h2>
    ${open ? `<div class="msg info">${open} Konto/Konten warten auf Freigabe.</div>` : ''}` +
    (data.map(c => `<div class="card"><div class="flex" style="justify-content:space-between">
      <h3>${h(c.restaurant_name || '(ohne Name)')}</h3>${c.approved ? '<span class="pill">freigegeben</span>' : '<span class="pill wait">wartet</span>'}</div>
      <div class="muted">${h(c.contact_name)} · ☎ ${h(c.phone)}<br>${h(c.address)}<br>${h(c.email)}</div>
      <button class="btn ${c.approved ? 'red' : ''} sm" style="margin-top:10px" onclick="approve('${c.id}',${!c.approved})">${c.approved ? 'Sperren' : 'Freigeben'}</button></div>`).join('')
    || '<div class="msg info">Noch keine Kunden registriert.</div>');
}
async function approve(id, v) {
  const { error } = await sb.from('profiles').update({ approved: v }).eq('id', id);
  if (error) return alert(error.message);
  adminCustomers();
}
async function adminProducts() {
  app().innerHTML = adminTabs('products') + '<p class="muted">Lädt…</p>';
  const all = await loadProducts(true);
  const cats = [...new Set(all.map(p => p.category).filter(Boolean))];
  app().innerHTML = adminTabs('products') + `
    <div class="card"><h3>Artikel hinzufügen</h3>
      <label>Name</label><input id="pn" placeholder="z. B. Tomaten">
      <div class="grid2"><div><label>Einheit</label><select id="pu">${UNITS.map(u => `<option>${u}</option>`).join('')}</select></div>
      <div><label>Kategorie</label><input id="pc" list="cats" placeholder="z. B. Gemüse"><datalist id="cats">${cats.map(c => `<option value="${h(c)}">`).join('')}</datalist></div></div>
      <button class="btn w" onclick="addProduct()">Hinzufügen</button>
      <details style="margin-top:14px"><summary>Viele Artikel auf einmal einfügen</summary>
        <p class="muted">Eine Zeile pro Artikel: <b>Name;Einheit;Kategorie</b><br>z. B. <i>Tomaten;kg;Gemüse</i></p>
        <textarea id="bulk" style="min-height:160px"></textarea>
        <button class="btn sec w" onclick="bulkAdd()">Alle einfügen</button></details></div>
    <h2>Artikel (${all.length})</h2>` +
    all.map(p => `<div class="row" style="${p.active ? '' : 'opacity:.5'}">${icon(p, 44)}<div class="n">${h(p.name)}<small>${h(p.unit)} · ${h(p.category || 'Sonstiges')}</small></div>
      <button class="btn sec sm" onclick="toggleProd(${p.id},${!p.active})">${p.active ? 'Ausblenden' : 'Einblenden'}</button>
      <button class="btn red sm" onclick="delProd(${p.id})">✕</button></div>`).join('');
}
async function addProduct() {
  const name = $('#pn').value.trim(); if (!name) return;
  const { error } = await sb.from('products').insert({ name, unit: $('#pu').value, category: $('#pc').value.trim() || null });
  if (error) return alert(error.message);
  adminProducts();
}
async function bulkAdd() {
  const rows = $('#bulk').value.split('\n').map(l => l.split(/[;\t]/).map(s => s.trim())).filter(r => r[0])
    .map(r => ({ name: r[0], unit: r[1] || 'kg', category: r[2] || null }));
  if (!rows.length) return;
  const { error } = await sb.from('products').insert(rows);
  if (error) return alert(error.message);
  alert(rows.length + ' Artikel eingefügt.'); adminProducts();
}
async function toggleProd(id, v) { const { error } = await sb.from('products').update({ active: v }).eq('id', id); if (error) alert(error.message); adminProducts(); }
async function delProd(id) {
  if (!confirm('Artikel wirklich löschen?')) return;
  const { error } = await sb.from('products').delete().eq('id', id); if (error) alert(error.message); adminProducts();
}

route();
</script>
</body>
</html>
